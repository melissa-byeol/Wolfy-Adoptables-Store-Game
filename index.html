<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Wolfies - Prototipo V2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Pantalla de Inicio -->
    <div id="start-screen" class="screen active">
        <h1>TIENDA DE WOLFIES</h1>
        <p>Bienvenido, nuevo emprendedor.</p>
        <button id="btn-new-game" class="btn primary">Nueva Partida</button>
        <button id="btn-load-game" class="btn secondary" disabled>Cargar Partida</button>
    </div>

    <!-- Pantalla Principal del Juego -->
    <div id="game-screen" class="screen hidden">
        
        <!-- Header con Datos Críticos -->
        <header class="stats-bar">
            <div class="stat-item">
                <span>Día:</span> <strong id="display-day">1</strong>
            </div>
            <div class="stat-item money">
                <span>Presupuesto:</span> <strong id="display-budget">$0.00</strong>
            </div>
            <div class="stat-item quota">
                <span>Meta Diaria:</span> <strong id="display-quota-status">Pendiente</strong>
            </div>
        </header>

        <!-- Área de Tienda (Mapa Visual) -->
        <main class="map-container">
            
            <!-- El Grid Principal: Representa la planta baja -->
            <div id="store-grid" class="store-grid">
                
                <!-- ZONA CAJERO (Columnas 0-2 aprox, ocupadas por este div ancho) -->
                <div class="zone-cashier">
                    <h3>CAJERO AUTOMÁTICO</h3>
                    <div class="cashier-icon">💰</div>
                    <p>Procesando ventas...</p>
                </div>

                <!-- ESTANTES (Se generan dinámicamente o se definen aquí) -->
                <!-- Usamos 3 contenedores grandes que internamente tienen 24 slots -->
                <div class="shelf-unit" id="shelf-1">
                    <div class="shelf-label">ESTANTE A</div>
                    <div class="shelf-slots-container"></div>
                </div>

                <div class="shelf-unit" id="shelf-2">
                    <div class="shelf-label">ESTANTE B</div>
                    <div class="shelf-slots-container"></div>
                </div>

                <div class="shelf-unit" id="shelf-3">
                    <div class="shelf-label">ESTANTE C</div>
                    <div class="shelf-slots-container"></div>
                </div>

            </div>

            <!-- Panel de Control Inferior -->
            <div class="control-panel">
                <div class="panel-row">
                    <button id="btn-restock-all" class="btn primary">Rellenar Todo ($15)</button>
                    <button id="btn-sell-fast" class="btn success">Vender 1 Rápido (+$1)</button>
                </div>
                <div class="stats-mini">
                    <span>Total Stock:</span> <strong id="display-total-stock-map">0</strong>/72
                </div>
            </div>

        </main>

        <!-- Footer con Control de Tiempo -->
        <footer class="controls-bar">
            <button id="btn-end-day" class="btn danger large">Terminar Día</button>
            <button id="btn-save-manual" class="btn ghost small">Guardar Manualmente</button>
        </footer>

        <!-- Modal de Mensajes -->
        <div id="message-modal" class="modal hidden">
            <div class="modal-content">
                <h2 id="modal-title">Mensaje</h2>
                <p id="modal-body">Contenido...</p>
                <button id="btn-close-modal" class="btn primary">Aceptar</button>
            </div>
        </div>

    </div>

    <!-- Scripts -->
    <script src="js/state.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/logic.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
